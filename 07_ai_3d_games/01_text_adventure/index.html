<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HAUNTED ADVENTURE 3D</title>
    <style>
      #back {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 8px 16px;
        font-size: 15px;
        font-weight: bold;
        color: #ffffff;
        text-decoration: none;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 8px;
      }
      #back:hover {
        background: rgba(0, 0, 0, 0.8);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050308;
        color: #efe6ff;
        font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
      }
      canvas {
        display: block;
      }
      #log {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        width: min(760px, calc(100% - 32px));
        box-sizing: border-box;
        max-height: 38vh;
        overflow-y: auto;
        background: rgba(8, 4, 16, 0.82);
        border: 1px solid #6b4a9e;
        border-radius: 10px;
        padding: 14px 20px;
        font-size: 17px;
        line-height: 1.7;
        white-space: pre-line;
      }
      /* スマホでは 3D の屋敷が見えるように、ログ欄を画面の下 1/4 ほどに収めて文字も小さくする */
      @media (pointer: coarse) {
        #log {
          bottom: 8px;
          max-height: 25vh;
          padding: 8px 12px;
          font-size: 14px;
          line-height: 1.6;
        }
        /* 文章をスクロールしても、選択肢はログ欄の下に見えたままにする */
        #choices {
          position: sticky;
          bottom: -8px;
          margin-bottom: -8px;
          padding: 6px 0 8px;
          background: rgb(8, 4, 16);
        }
        #choices button {
          font-size: 14px;
        }
      }
      #log .story-title {
        color: #c9a3ff;
        font-weight: bold;
      }
      #log .warn {
        color: #ff9a9a;
      }
      #choices {
        display: flex;
        gap: 12px;
        margin-top: 8px;
      }
      #choices button {
        flex: 1;
        padding: 8px 12px;
        font-size: 16px;
        color: #efe6ff;
        background: #2a1a44;
        border: 1px solid #8f6ad0;
        border-radius: 6px;
        cursor: pointer;
      }
      #choices button:hover {
        background: #3d2763;
      }
      #result {
        position: fixed;
        top: 18%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 64px;
        font-weight: bold;
        letter-spacing: 6px;
        pointer-events: none;
      }
      #flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <a id="back" href="../" tabindex="-1">&larr; Back</a>
    <div id="flash"></div>
    <div id="result"></div>
    <div id="log"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
